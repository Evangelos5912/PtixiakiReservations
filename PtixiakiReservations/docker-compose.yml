services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ptixiaki_web
    restart: always
    ports:
      - "80:5000" 
    volumes:
      - ./wwwroot/images:/app/wwwroot/images
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS};Include Error Detail=true
      - ElasticSettings__Uri=http://elasticsearch:9200
      - EmailSettings__SenderEmail=${EMAIL_ADDRESS}
      - EmailSettings__SenderPassword=${EMAIL_PASSWORD}
      - Gemini__ApiKey=${GEMINI_API_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: ptixiaki_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: ptixiaki_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - ES_JAVA_OPTS=-Xms512m -Xmx512m 
      - network.host=127.0.0.1      
      - http.host=0.0.0.0
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  elastic_data: