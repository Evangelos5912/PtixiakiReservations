services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ptixiaki_web
    restart: always
    ports:
      - "80:5000" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS};Include Error Detail=true
      - ElasticSettings__Uri=http://elasticsearch:9200
      - EmailSettings__SenderEmail=${EMAIL_ADDRESS}
      - EmailSettings__SenderPassword=${EMAIL_PASSWORD}
    depends_on:
      - elasticsearch
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: ptixiaki_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: ptixiaki_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - ES_JAVA_OPTS=-Xms512m -Xmx512m 
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  elastic_data: